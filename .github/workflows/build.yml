# Compiles the PDFs with LuaLaTeX on every push and pull request.
#
# What it builds depends on where it runs. The job "What to build" tells the three apart:
#   a manuscript (a copy that "Configure manuscript" has configured): main.tex and
#     title_page.tex as they are, in one job; and, in a second job, the HTML copy of the
#     manuscript that opens in Microsoft Word;
#   a copy that nobody has configured yet: main.tex and title_page.tex as they came, in
#     one job, and nothing else;
#   the template itself: the skeleton of every journal and article type, each written by
#     scripts/configure.py and compiled in a job of its own; the tests; the commands the
#     README gives for a laptop; and the HTML copy of the skeleton the template ships.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: The branch or commit to build (default, the one that started the run)
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event_name }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  # The template itself. A copy made with "Use this template" has another name.
  TEMPLATE_REPOSITORY: OpenSpineConsortium/RSNATemplate
  # TeX Live, as one fixed image: a dated tag and its digest. The build does not change
  # until this line does. To move to a newer TeX Live, take the newest dated tag and its
  # digest from https://github.com/xu-cheng/latex-docker/pkgs/container/texlive-alpine
  TEXLIVE_IMAGE: ghcr.io/xu-cheng/texlive-alpine:20261001@sha256:c06416ebbc69c8e90e07d1f1a6f7a3f9b334e773daa3543ce879ea533317c3a7

# Every action is named by the commit of its release, with the release after it.
jobs:
  plan:
    name: What to build
    runs-on: ubuntu-latest
    outputs:
      state: ${{ steps.plan.outputs.state }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # The state is "manuscript", "copy" or "template" (matrix() in scripts/configure.py).
      # A manuscript whose author has deleted the template's scripts still builds:
      # without the script, there is the manuscript and nothing else to compile.
      - name: List what to build
        id: plan
        env:
          IS_TEMPLATE: ${{ github.event.repository.is_template }}
        run: |
          if [ -f scripts/configure.py ]; then
            python3 scripts/configure.py --matrix >> "$GITHUB_OUTPUT"
          else
            echo 'state=manuscript' >> "$GITHUB_OUTPUT"
            echo 'matrix=[{"name":"Manuscript","slug":"manuscript","journal":"","type":"","configure":false}]' >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"
          if grep -q '^state=copy$' "$GITHUB_OUTPUT"; then
            echo "::notice title=Not configured yet::This copy has no journal and article type yet, so the build compiles main.tex and title_page.tex as they came. To choose them: Actions, Configure manuscript, Run workflow."
          fi

  # Only in the template.
  tests:
    name: Tests
    needs: plan
    if: needs.plan.outputs.state == 'template'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Run the tests
        run: pipx run --spec "pytest==8.3.5" pytest -q tests

  pdf:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # Only in the template: write the skeleton of this journal and article type, the way
      # the "Configure manuscript" workflow does. The title carries every character that
      # LaTeX treats specially, so the check also proves that a typed title cannot break it.
      - name: Write the skeleton
        if: ${{ matrix.configure }}
        env:
          RSNA_JOURNAL: ${{ matrix.journal }}
          RSNA_TYPE: ${{ matrix.type }}
          RSNA_TITLE: 'Check of the template: 100% of A & B, under_score, #1, {braces}, ~tilde, ^caret, \backslash, $dollar'
          RSNA_DESCRIPTION: Written by the build, to check that this skeleton compiles.
        run: python3 scripts/configure.py

      # TeX Live in a container. RSNA_HTML=0: the PDFs alone, even where an author has set
      # latexmkrc to make the HTML copy at every build (the job "word" makes that copy).
      - name: Compile with LuaLaTeX
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # 4.1.0
        with:
          docker_image: ${{ env.TEXLIVE_IMAGE }}
          root_file: |
            main.tex
            title_page.tex
          latexmk_use_lualatex: true
          pre_compile: export RSNA_HTML=0

      - name: Check that both PDFs were made
        run: |
          for file in main.pdf title_page.pdf; do
            if ! head -c 5 "$file" | grep -q '%PDF-'; then
              echo "::error::$file was not made"
              exit 1
            fi
          done
          ls -l main.pdf title_page.pdf

      # Only in the template, where the sample text must come out whole: every reference
      # and citation resolved, the list of abbreviations made, the fallback font in use.
      - name: Check that nothing is left unresolved
        if: ${{ matrix.configure }}
        run: |
          if grep -n -E "There were undefined references|Citation .* undefined|Please \(re\)run Biber|Empty bibliography|Rerun to get" main.log; then
            echo "::error::main.log reports something left unresolved"
            exit 1
          fi
          if ! test -s main.acr; then
            echo "::error::the list of abbreviations (main.acr) was not made"
            exit 1
          fi
          grep -h "rsnafont:" main.log title_page.log || echo "Times New Roman was found on this machine"

      - name: Keep the PDFs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdf-${{ matrix.slug }}
          path: |
            main.pdf
            title_page.pdf
          if-no-files-found: error

  # In a manuscript, and in the template for the skeleton it ships: the HTML copy of the
  # manuscript that opens in Microsoft Word, for the journals that take the text as a Word
  # file. It is made by the same latexmkrc an author runs on a laptop (lwarp, as in the
  # template this one descends from), which makes the copy when RSNA_HTML=1 asks for it.
  # In a manuscript the PDFs above are the check and this copy comes on top: a failure here
  # does not fail the run. In the template it does.
  word:
    name: HTML copy for Microsoft Word
    needs: plan
    if: needs.plan.outputs.state != 'copy'
    runs-on: ubuntu-latest
    continue-on-error: ${{ needs.plan.outputs.state != 'template' }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # After the PDF, latexmkrc makes the HTML copy. lwarp needs the poppler tools
      # (pdftotext, pdftocairo) for that.
      - name: Compile with LuaLaTeX, then make the HTML copy
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # 4.1.0
        with:
          docker_image: ${{ env.TEXLIVE_IMAGE }}
          root_file: main.tex
          latexmk_use_lualatex: true
          extra_system_packages: poppler-utils
          pre_compile: export RSNA_HTML=1

      - name: Check that the HTML copy was made
        run: |
          if ! test -s main.html; then
            echo "::error::main.html was not made"
            exit 1
          fi
          ls -l main.html

      - name: Keep the HTML copy
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: word-manuscript
          path: |
            main.html
            *.css
            *.svg
            main-images/
          if-no-files-found: error

  # Only in the template: the two commands the README gives for a laptop, on the skeleton
  # the template ships. "latexmk" with no file name and no option: latexmkrc names the
  # engine and the two documents, and makes no HTML copy. Then the same command with
  # RSNA_HTML=1, which makes the HTML copy. The step after them finds both PDFs made and
  # has nothing left to do.
  laptop:
    name: latexmk with no file name, as on a laptop
    needs: plan
    if: needs.plan.outputs.state == 'template'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Run latexmk
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # 4.1.0
        with:
          docker_image: ${{ env.TEXLIVE_IMAGE }}
          root_file: title_page.tex
          latexmk_use_lualatex: true
          extra_system_packages: poppler-utils
          pre_compile: |
            latexmk --interaction=nonstopmode --halt-on-error
            test -s main.pdf
            test -s title_page.pdf
            test -s main.acr
            test ! -e main.html
            RSNA_HTML=1 latexmk --interaction=nonstopmode --halt-on-error
            test -s main.html
