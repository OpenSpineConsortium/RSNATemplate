# TEMPORARY, removed by the next commit. Three things that the Build workflow of the
# template cannot show by itself:
#   1. the build of a repository that has been configured as a manuscript (this commit
#      carries such a state, so the Build run of this commit shows it);
#   2. build.yml when it is called by another workflow, the way configure.yml calls it;
#   3. the HTML copy for Microsoft Word that latexmkrc makes for an author after the PDF.
name: Temporary checks

on: push

permissions:
  contents: read

jobs:
  call:
    name: Called
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.ref_name }}

  html:
    name: HTML copy for Word, as an author gets it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # no RSNA_PDF_ONLY here: latexmkrc runs its HTML steps after the PDF
      - uses: xu-cheng/latex-action@4.1.0
        with:
          root_file: main.tex
          latexmk_use_lualatex: true
          extra_system_packages: poppler-utils
          post_compile: |
            echo "=== exit status of latexmk so far: $ret"
            echo "=== files"
            ls -la
            echo "=== lwarpmk.conf"
            cat lwarpmk.conf || true
            echo "=== html files"
            ls -la *.html || true
            wc -c *.html || true
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: html-experiment
          path: |
            *.html
            *.css
            *.log
            lwarpmk.conf
            main.pdf
          if-no-files-found: warn
